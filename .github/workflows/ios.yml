name: Build iOS IPA (TorqueLog)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-ios:
    name: Build iOS Unsigned IPA and Simulator Build
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4' # Specifying a stable modern Xcode version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Add and Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/App/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update || pod install

      - name: Build Unsigned iOS Archive (For Sideloading/Signing)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     clean archive \
                     -archivePath ios/App/build/App.xcarchive

      - name: Package Unsigned IPA
        run: |
          mkdir -p ios/App/build/Payload
          cp -r ios/App/build/App.xcarchive/Products/Applications/App.app ios/App/build/Payload/
          cd ios/App/build
          zip -r TorqueLog-Unsigned.ipa Payload

      - name: Build for iOS Simulator (Drag & Drop Testing)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -sdk iphonesimulator \
                     -configuration Debug \
                     -derivedDataPath ios/App/build/simulator \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build

      - name: Package Simulator App Bundle
        run: |
          cd ios/App/build/simulator/Build/Products/Debug-iphonesimulator
          zip -r TorqueLog-Simulator-App.zip App.app

      - name: Upload Unsigned IPA (For Devices / Sideloading)
        uses: actions/upload-artifact@v4
        with:
          name: TorqueLog-Unsigned-iOS-IPA
          path: ios/App/build/TorqueLog-Unsigned.ipa

      - name: Upload Simulator App (For Simulator Testing)
        uses: actions/upload-artifact@v4
        with:
          name: TorqueLog-Simulator-App
          path: ios/App/build/simulator/Build/Products/Debug-iphonesimulator/TorqueLog-Simulator-App.zip

      - name: Create or Update GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "TorqueLog Mobile Apps (Latest Build)"
          draft: false
          prerelease: false
          files: |
            ios/App/build/TorqueLog-Unsigned.ipa
            ios/App/build/simulator/Build/Products/Debug-iphonesimulator/TorqueLog-Simulator-App.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
